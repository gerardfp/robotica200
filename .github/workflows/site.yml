name: Validar i publicar web estàtica

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instal·lar Typst per generar els PDF imprimibles
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ^0.14.0
      - name: Instal·lar Ghostscript per optimitzar els PDF
        run: sudo apt-get update && sudo apt-get install --yes ghostscript
      - name: Recuperar memòria cau dels PDF imprimibles
        id: printable-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/robotica200-print-pdf-cache
          key: robotica200-print-pdfs-${{ runner.os }}-${{ hashFiles('_content/**/*.md', '_assets/**/*', '_scripts/md_to_typst.py') }}
          restore-keys: |
            robotica200-print-pdfs-${{ runner.os }}-
      - name: Compilar només els PDF modificats
        env:
          ROBOTICA_PDF_CACHE: ${{ runner.temp }}/robotica200-print-pdf-cache
        run: node _scripts/build.js --pdf
      - name: Guardar memòria cau actualitzada dels PDF
        if: github.event_name != 'pull_request' && steps.printable-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/robotica200-print-pdf-cache
          key: robotica200-print-pdfs-${{ runner.os }}-${{ hashFiles('_content/**/*.md', '_assets/**/*', '_scripts/md_to_typst.py') }}
      - name: Comprovar JavaScript
        run: |
          node --check _js/ui.js
          node --check _scripts/build.js
          node --check _scripts/dev.js
          node --check _scripts/test.js
      - name: Executar suite de validació (HTML estàtic, Markdown semàntic i tutorials)
        run: node _scripts/test.js
      - name: Preparar web estàtica descarregable
        uses: actions/upload-artifact@v4
        with:
          name: robotica200-web
          path: dist
          include-hidden-files: true
          if-no-files-found: error
      - name: Preparar artefacto de Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
