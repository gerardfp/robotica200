<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>

<h2 id="qu%C3%A8-ens-emportarem-hui">Què ens emportarem hui?</h2>
<p>Una manera de triar material segons l’aprenentatge.</p>
<p>Una primera activitat que puguem explicar i preparar.</p>
<p>Una pauta per organitzar equips i observar què aprenen.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-theme="robotica" data-lang="ca" lang="ca" data-marpit-pagination="4" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="com-treballarem">Com treballarem</h2>
<p>Projector i conversa, amb reptes breus en parelles.</p>
<p>Podem resoldre’ls oralment; si tenim paper, hi representarem les proves.</p>
<p>Si hi ha robots, una prova assajada substituirà la simulació.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="activity" data-theme="robotica" data-lang="ca" lang="ca" class="activity" data-marpit-pagination="5" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:activity;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="abans-de-comen%C3%A7ar--2-minuts">Abans de començar · 2 minuts</h2>
<p>Penseu en un contingut que ja treballeu amb el vostre grup.</p>
<p>Expliqueu-lo a la persona del costat.</p>
<p>Conserveu aquest exemple: al final triarem si algun material ens ajuda a treballar-lo.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="diagram" data-theme="robotica" data-lang="ca" lang="ca" class="diagram" data-marpit-pagination="6" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:diagram;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="el-repte-de-la-biblioteca">El repte de la biblioteca</h2>
<img class="explanatory-diagram" src="../diagrames/ruta-repte.svg" alt="El repte de la biblioteca" />
<p><strong>A1 ↑ → biblioteca B3.</strong> Una ordre «avant» avança una casella; un gir canvia l’orientació sense moure la fitxa.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="activity" data-theme="robotica" data-lang="ca" lang="ca" class="activity" data-marpit-pagination="7" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:activity;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="escriviu-una-ruta--3-minuts">Escriviu una ruta · 3 minuts</h2>
<ol>
<li>Acordeu les ordres per arribar a la biblioteca.</li>
<li>Una persona les escriu o les diu.</li>
<li>L’altra les executa amb el dit o mentalment.</li>
</ol>
<p>Comproveu també <strong>cap on mira al final</strong>.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="solution" data-theme="robotica" data-lang="ca" lang="ca" class="solution" data-marpit-pagination="8" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:solution;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">

<h2 id="qu%C3%A8-podem-aprendre">Què podem aprendre?</h2>

<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>

<h2 id="qu%C3%A8-ens-ha-obligat-a-pensar">Què ens ha obligat a pensar?</h2>
<div class="flow"><span>Situar-nos</span><span class="arrow">→</span><span>Ordenar</span><span class="arrow">→</span><span>Anticipar</span><span class="arrow">→</span><span>Comprovar</span></div>
<p>Hem necessitat un inici, una orientació i ordres compartides.</p>
<p>Una altra ruta també pot ser correcta: cal executar-la i justificar-la.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>

<h2 id="girar-i-avan%C3%A7ar-s%C3%B3n-accions-diferents">Girar i avançar són accions diferents</h2>
<img class="explanatory-diagram" src="../diagrames/gir-desplacament.svg" alt="Girar i avançar són accions diferents" />
<p>La dreta és la del personatge segons cap on mira. <strong>Després d’un gir, continuem a la mateixa casella.</strong></p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-theme="robotica" data-lang="ca" lang="ca" data-marpit-pagination="13" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="pensament-computacional-amb-un-exemple">Pensament computacional, amb un exemple</h2>
<p><strong>Descompondre:</strong> dividir la ruta en moviments.<br />
<strong>Crear una seqüència:</strong> ordenar les instruccions.<br />
<strong>Depurar:</strong> localitzar i corregir una ordre.</p>
<p>El vocabulari posa nom a decisions que ja hem pres.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="visual" data-theme="robotica" data-lang="ca" lang="ca" class="visual" data-marpit-pagination="14" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:visual;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="llegir-provar-i-revisar-una-ordre">Llegir, provar i revisar una ordre</h2>
<img class="side-image" src="../../_assets/tutorials/tb-esborrat-depuracio.webp" alt="Il·lustració del projecte: Llegir, provar i revisar una ordre" />
<p>La il·lustració mostra versions d’una seqüència.</p>
<p><strong>Abans:</strong> què esperem que faça?</p>
<p><strong>Després:</strong> quina ordre hem revisat i quin efecte té?</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-theme="robotica" data-lang="ca" lang="ca" data-marpit-pagination="15" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="quin-aprenentatge-guia-la-proposta">Quin aprenentatge guia la proposta?</h2>
<p><strong>Llengua:</strong> explicar una ruta perquè una altra persona la seguisca.</p>
<p><strong>Matemàtiques:</strong> descriure posicions i canvis d’orientació.</p>
<p><strong>Medi:</strong> comparar dades obtingudes amb el mateix procediment.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-theme="robotica" data-lang="ca" lang="ca" data-marpit-pagination="16" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="lactivitat-necessita-una-evid%C3%A8ncia">L’activitat necessita una evidència</h2>
<p>Arribar al destí és un resultat.</p>
<p><strong>Explicar per què hem canviat una ordre</strong> ens informa de la comprensió.</p>
<p>Podem recollir una ruta anotada, una conversa o dues versions del programa.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="activity" data-theme="robotica" data-lang="ca" lang="ca" class="activity" data-marpit-pagination="17" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:activity;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="de-la-pantalla-a-la-conversa--3-minuts">De la pantalla a la conversa · 3 minuts</h2>
<p>Recupereu el contingut que heu triat en començar.</p>
<p>Què hauria de fer o explicar l’alumnat per demostrar que l’ha entés?</p>
<p>Compartim dues respostes concretes.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="section" data-theme="robotica" data-lang="ca" lang="ca" class="section" data-marpit-pagination="18" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:section;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="coneixem-les-possibilitats">Coneixem les possibilitats</h2>
<p><strong>30–55 min · 25 minuts</strong></p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="visual" data-theme="robotica" data-lang="ca" lang="ca" class="visual" data-marpit-pagination="19" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:visual;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="tale-bot">Tale-Bot</h2>
<img class="side-image" src="../../_assets/robots/tale-bot.webp" alt="Il·lustració del projecte: Tale-Bot" />
<p>Programem moviments amb els botons del robot.</p>
<p><strong>Una proposta:</strong> Una ruta entre tres llocs d’un conte.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-theme="robotica" data-lang="ca" lang="ca" data-marpit-pagination="20" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="tale-bot--primera-decisi%C3%B3">Tale-Bot · Primera decisió</h2>
<p><strong>Què cal tindre present?</strong></p>
<p>Els mapes interactius necessiten zones codificades compatibles; una quadrícula de paper serveix per orientar-nos, però no activa eixes funcions.</p>
<p><strong>Abans de la prova:</strong> què esperem observar?<br />
<strong>Després:</strong> quina decisió podrà explicar l’alumnat?</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="tangible" data-theme="robotica" data-lang="ca" lang="ca" class="tangible" data-marpit-pagination="21" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:tangible;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="tale-bot--llegim-els-botons-en-ordre">Tale-Bot · Llegim els botons en ordre</h2>
<p><img src="../diagrames/programa-talebot-f3c6d031d55c435e.svg" alt="" style="width:1000px;" /></p>
<p>Preparem les ordres i després premem <strong>executa</strong>. El gir canvia l’orientació: no avança. Les icones representen la seqüència, no la disposició física dels botons.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="visual" data-theme="robotica" data-lang="ca" lang="ca" class="visual" data-marpit-pagination="22" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:visual;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="coding-set">Coding Set</h2>
<img class="side-image" src="../../_assets/robots/coding-set.webp" alt="Il·lustració del projecte: Coding Set" />
<p>Construïm el programa amb peces al tauler; la torre el llig i el MatataBot el segueix.</p>
<p><strong>Una proposta:</strong> Comparar dues seqüències movent una peça.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-theme="robotica" data-lang="ca" lang="ca" data-marpit-pagination="23" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="coding-set--primera-decisi%C3%B3">Coding Set · Primera decisió</h2>
<p><strong>Què cal tindre present?</strong></p>
<p>Cal preparar torre, tauler i robot; no són botons sobre el mateix robot.</p>
<p><strong>Abans de la prova:</strong> què esperem observar?<br />
<strong>Després:</strong> quina decisió podrà explicar l’alumnat?</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="tangible" data-theme="robotica" data-lang="ca" lang="ca" class="tangible" data-marpit-pagination="24" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:tangible;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="coding-set--llegim-les-peces">Coding Set · Llegim les peces</h2>
<p><img src="../diagrames/programa-coding-set-0b71b3380b8f68d7.svg" alt="" style="width:1000px;" /></p>
<p>Al tauler, llegim les peces <strong>d’esquerra a dreta i de dalt a baix</strong>. Aquesta fila representa una ruta; la torre ha de poder llegir-la abans d’executar-la.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="diagram" data-theme="robotica" data-lang="ca" lang="ca" class="diagram" data-marpit-pagination="25" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:diagram;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">

<img class="explanatory-diagram" src="../diagrames/coding-set-sistema.svg" alt="Coding Set · Com circulen les ordres?" />
<p>El tauler manté el programa visible. La torre el llig i envia les ordres; el MatataBot les executa.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="visual" data-theme="robotica" data-lang="ca" lang="ca" class="visual" data-marpit-pagination="26" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:visual;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">

<img class="side-image" src="../../_assets/robots/coding-express.webp" alt="Il·lustració del projecte: Coding Express" />
<p>La via defineix el recorregut; els maons d’acció provoquen respostes del tren.</p>

<p>El tren no tria una destinació. Els girs de la via no són ordres de gir com en Tale-Bot.</p>

<strong>Després:</strong> quina decisió podrà explicar l’alumnat?</p>

<img class="explanatory-diagram" src="../diagrames/tren-via-accio.svg" alt="Coding Express · Via i resposta" />
<p>La via resol el recorregut. El maó introdueix una resposta. <strong>No és una ordre de gir en una quadrícula.</strong></p>

<strong>Després:</strong> quina decisió podrà explicar l’alumnat?</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="pause" data-theme="robotica" data-lang="ca" lang="ca" class="pause" data-marpit-pagination="36" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:pause;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="pausa--5-minuts">Pausa · 5 minuts</h2>
<p>En tornar, continuarem amb el bloc següent.</p>
<p>Deixeu anotada una pregunta que vulgueu recuperar.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="section" data-theme="robotica" data-lang="ca" lang="ca" class="section" data-marpit-pagination="37" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:section;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="del-programa-a-la-resposta">Del programa a la resposta</h2>
<p><strong>60–85 min · 25 minuts</strong></p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="visual" data-theme="robotica" data-lang="ca" lang="ca" class="visual" data-marpit-pagination="38" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:visual;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="demostraci%C3%B3--una-resposta-al-bot%C3%B3-a">Demostració · Una resposta al botó A</h2>
<img class="side-image" src="../../_assets/tutorials/cr-primeres-passes.webp" alt="Il·lustració del projecte: Demostració · Una resposta al botó A" />
<p><strong>Objectiu:</strong> entendre què inicia el programa.</p>
<p>Primer llegim el programa. Després anticipem la pantalla.</p>
<p>Codey pot fer aquesta prova sense moure Rocky.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="blocks" data-theme="robotica" data-lang="ca" lang="ca" class="blocks" data-marpit-pagination="39" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:blocks;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="codey--llegim-el-programa">Codey · Llegim el programa</h2>
<p><img src="../diagrames/programa-mblock-8970144ed4c0e574.svg" alt="" style="width:1000px;" /></p>
<p><strong>Què inicia la seqüència? Què ocorre durant l’espera?</strong></p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="activity" data-theme="robotica" data-lang="ca" lang="ca" class="activity" data-marpit-pagination="40" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:activity;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="codey--predicci%C3%B3-abans-de-provar">Codey · Predicció abans de provar</h2>
<p>Quan premem A, què veurem…</p>
<ul>
<li>just després?</li>
<li>mig segon després?</li>
<li>dos segons després?</li>
</ul>
<p>En parelles, acordeu les tres respostes.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="diagram" data-theme="robotica" data-lang="ca" lang="ca" class="diagram" data-marpit-pagination="41" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:diagram;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="codey--la-seq%C3%BC%C3%A8ncia-en-el-temps">Codey · La seqüència en el temps</h2>
<img class="explanatory-diagram" src="../diagrames/event-temps.svg" alt="Codey · La seqüència en el temps" />
<p>Suposem que només premem A una vegada. L’espera manté el cor abans d’apagar la pantalla.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-theme="robotica" data-lang="ca" lang="ca" data-marpit-pagination="42" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="codey--una-modificaci%C3%B3-una-predicci%C3%B3">Codey · Una modificació, una predicció</h2>
<p><strong>Repte:</strong> volem veure el cor durant tres segons.</p>
<p>Quin bloc canvia? Quins es conserven?</p>
<p><strong>Resposta:</strong> canvia l’espera d’1 a 3 segons. El botó i el dibuix continuen igual.</p>
<p>Pregunta docent: «Com ho sabies abans de provar?»</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="diagram" data-theme="robotica" data-lang="ca" lang="ca" class="diagram" data-marpit-pagination="43" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:diagram;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="un-bot%C3%B3-i-un-sensor-aporten-informaci%C3%B3">Un botó i un sensor aporten informació</h2>
<img class="explanatory-diagram" src="../diagrames/entrada-programa-eixida.svg" alt="Un botó i un sensor aporten informació" />
<p>El programa el dissenyem nosaltres. Un botó activa un esdeveniment; un sensor aporta una lectura que podem comparar.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="visual" data-theme="robotica" data-lang="ca" lang="ca" class="visual" data-marpit-pagination="44" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:visual;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="demostraci%C3%B3--un-fanalet-amb-microbit">Demostració · Un fanalet amb micro:bit</h2>
<img class="side-image" src="../../_assets/tutorials/mb-fanalet-llum-flat.webp" alt="Il·lustració del projecte: Demostració · Un fanalet amb micro:bit" />
<p><strong>Pregunta:</strong> com fem que una icona responga a la llum?</p>
<p>La matriu LED pot mostrar dibuixos i estimar la llum.</p>
<p>Primer observem lectures; després triem una condició.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="diagram" data-theme="robotica" data-lang="ca" lang="ca" class="diagram" data-marpit-pagination="45" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:diagram;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="la-llum-obri-dues-possibilitats">La llum obri dues possibilitats</h2>
<img class="explanatory-diagram" src="../diagrames/decisio-llum.svg" alt="La llum obri dues possibilitats" />
<p>El programa segueix <strong>una branca en cada comprovació</strong>. 80 és un exemple: primer cal observar les lectures reals.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="section" data-theme="robotica" data-lang="ca" lang="ca" class="section" data-marpit-pagination="46" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:section;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="com-ho-organitzem">Com ho organitzem?</h2>
<p><strong>85–100 min · 15 minuts</strong></p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-theme="robotica" data-lang="ca" lang="ca" data-marpit-pagination="47" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="una-tria-inicial-raonable">Una tria inicial raonable</h2>
<p><strong>Primer cicle:</strong> rutes curtes i narració amb Tale-Bot o Coding Set.</p>
<p><strong>Segon cicle:</strong> ampliar rutes o començar respostes amb Codey Rocky.</p>
<p><strong>Tercer cicle:</strong> dades amb micro:bit o mecanismes amb SPIKE.</p>
<p>Són punts de partida flexibles, segons experiència i material.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="visual" data-theme="robotica" data-lang="ca" lang="ca" class="visual" data-marpit-pagination="48" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:visual;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="una-funci%C3%B3-%C3%A9s-suficient-per-comen%C3%A7ar">Una funció és suficient per començar</h2>
<img class="side-image" src="../../_assets/tutorials/tb-primeres-passes.webp" alt="Il·lustració del projecte: Una funció és suficient per començar" />
<p><strong>Primer:</strong> observar un moviment.</p>
<p><strong>Després:</strong> preparar dues ordres i anticipar el final.</p>
<p><strong>Ampliar:</strong> afegir un gir quan el grup puga explicar les primeres proves.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="visual" data-theme="robotica" data-lang="ca" lang="ca" class="visual" data-marpit-pagination="49" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:visual;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="una-ruta-per-contar-una-hist%C3%B2ria">Una ruta per contar una història</h2>
<img class="side-image" src="../../_assets/situacions/tb-biblioteca-barri.webp" alt="Il·lustració del projecte: Una ruta per contar una història" />
<p>Observeu la il·lustració.</p>
<p>Quin lloc seria l’inici?<br />
Quina parada tindria sentit en el relat?<br />
Què explicaria l’alumnat en arribar-hi?</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="diagram" data-theme="robotica" data-lang="ca" lang="ca" class="diagram" data-marpit-pagination="50" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:diagram;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="una-prova-amb-treball-per-a-tothom">Una prova amb treball per a tothom</h2>
<img class="explanatory-diagram" src="../diagrames/equips-torns.svg" alt="Una prova amb treball per a tothom" />
<p>Cada equip conserva la seua tasca mentre espera. El torn acaba amb una observació que els altres poden aprofitar.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-theme="robotica" data-lang="ca" lang="ca" data-marpit-pagination="51" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="rols-rotatius">Rols rotatius</h2>
<p><strong>Planifica:</strong> proposa i justifica les ordres.<br />
<strong>Programa:</strong> introdueix allò acordat.<br />
<strong>Comprova:</strong> compara predicció i resultat.<br />
<strong>Explica:</strong> registra una decisió.</p>
<p>En equips de tres, uniu comprovació i explicació.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-theme="robotica" data-lang="ca" lang="ca" data-marpit-pagination="52" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="participar-tamb%C3%A9-%C3%A9s-anticipar-i-explicar">Participar també és anticipar i explicar</h2>
<p>Fletxes grans, consignes orals i temps per pensar.</p>
<p>Podem explicar amb veu, dibuix o demostració.</p>
<p>Una altra persona pot manipular el dispositiu seguint les nostres instruccions.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="diagram" data-theme="robotica" data-lang="ca" lang="ca" class="diagram" data-marpit-pagination="53" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:diagram;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="com-acompanyem-una-revisi%C3%B3">Com acompanyem una revisió?</h2>
<img class="explanatory-diagram" src="../diagrames/revisio-cicle.svg" alt="Com acompanyem una revisió?" />
<p>Preguntem què esperàvem i què ha passat. Després canviem <strong>una sola cosa</strong> i tornem a provar.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="section" data-theme="robotica" data-lang="ca" lang="ca" class="section" data-marpit-pagination="54" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:section;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="preparem-una-primera-proposta">Preparem una primera proposta</h2>
<p><strong>100–120 min · 20 minuts</strong></p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="activity" data-theme="robotica" data-lang="ca" lang="ca" class="activity" data-marpit-pagination="55" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:activity;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="la-proposta-que-memporte--5-minuts">La proposta que m’emporte · 5 minuts</h2>
<p>Completeu oralment o en paper:</p>
<p><strong>Amb el meu grup treballaria…</strong><br />
<strong>El repte seria…</strong><br />
<strong>La primera prova consistiria en…</strong><br />
<strong>Sabria que han aprés perquè…</strong></p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-theme="robotica" data-lang="ca" lang="ca" data-marpit-pagination="56" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="compartim-una-decisi%C3%B3">Compartim una decisió</h2>
<p>Expliqueu a una altra parella la proposta en un minut.</p>
<p>Qui escolta pregunta: <strong>«Què farà l’alumnat per demostrar-ho?»</strong></p>
<p>Reviseu un element abans de donar-la per preparada.</p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-theme="robotica" data-lang="ca" lang="ca" data-marpit-pagination="57" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="abans-de-la-primera-prova-a-laula">Abans de la primera prova a l’aula</h2>
<p>Comproveu material, espai i alimentació.<br />
Prepareu una alternativa en paper.<br />
Reserveu temps per explicar una millora.</p>
<p><strong>Una primera experiència curta i comprensible és suficient per començar.</strong></p>
<footer>Robòtica per a docents · Sessió 1 · Comuna als dos formats</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-class="resources" data-theme="robotica" data-lang="ca" lang="ca" class="resources" data-marpit-pagination="58" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--class:resources;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-footer="Robòtica per a docents · Sessió 1 · Comuna als dos formats" data-theme="robotica" data-lang="ca" lang="ca" data-marpit-pagination="59" style="--paginate:true;--footer:Robòtica per a docents · Sessió 1 · Comuna als dos formats;--theme:robotica;--lang:ca;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="recursos-per-continuar">Recursos per continuar</h2>
<p><strong>Tutorials del web:</strong> preparar connexions, controls i primeres proves.</p>
<p><strong>Situacions d’aprenentatge:</strong> context, seqüència i evidències per adaptar.</p>
