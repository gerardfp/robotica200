<!DOCTYPE html>
<html lang="{{ site.language }}" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.seo_title }}</title>
  <meta name="description" content="{{ page.description }}">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-badge">🤖</span>
        <div class="logo-text">
          <span class="logo-name">{{ site.name }}</span>
          <span class="logo-subtitle">{{ site.subtitle }}</span>
        </div>
      </a>
      <nav class="header-nav" aria-label="Navegació principal">
        {% for item in site.navigation %}
        <a href="{{ item.href }}" class="nav-btn{% if item.href == page.active %} active{% endif %}"{% if item.href == page.url %} aria-current="page"{% endif %}>{{ item.label }}</a>
        {% endfor %}
      </nav>
      <button class="theme-toggle" id="theme-toggle" aria-label="Canviar tema de color">
        <span id="theme-icon" aria-hidden="true">🌙</span>
      </button>
    </div>
  </header>
  <main class="container page-content">
    {% if page.back %}
    <div class="section-nav-back">
      <a href="{{ page.back.href }}" class="btn-back">{{ page.back.label }}</a>
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <div class="container"><p>{{ site.name }} • {{ site.subtitle }}</p></div>
  </footer>
  <script src="js/theme.js"></script>
  {% if page.active == 'situacions-aprenentatge.html' %}<script src="js/filters.js"></script>{% endif %}
</body>
</html>
