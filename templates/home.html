{% extends 'base.html' %}
{% block content %}
<div class="home-intro">
  <button type="button" class="home-hero-icon" aria-label="Interactua amb el robot de Robòtica 200">
    <svg viewBox="0 0 73.025 75.142" class="home-hero-svg" role="img" aria-label="Robot Robòtica 200" xmlns="http://www.w3.org/2000/svg">
      <rect id="antenna" x="27.252" y="0" width="18.521" height="7.408" rx="3.175" fill="#f59e0b"/>
      <rect id="head" x="0" y="8.996" width="73.025" height="66.146" rx="22.49" fill="#2563eb"/>
      <rect id="face" x="7.938" y="21.431" width="57.15" height="41.275" rx="14.552" fill="#0f172a"/>
      <circle id="right_eye" cx="23.161" cy="38.629" r="6.35" fill="#38bdf8"/>
      <circle id="left_eye" cx="49.62" cy="38.629" r="6.35" fill="#38bdf8"/>
      <path id="mouth" d="m40.434 46.66a4.427 3.936 0 0 1-3.915 2.117 4.427 3.936 0 0 1-3.928-2.101l-1.768.793a6.364 5.657 0 0 0 5.698 3.108 6.364 5.657 0 0 0 5.68-3.135z" fill="#38bdf8"/>
    </svg>
  </button>
  <h1 class="home-title">Robòtica<sup>200</sup></h1>
  <div class="home-desc">{{ page.body }}</div>
</div>
<div class="three-pillars">
  {% for pillar in page.pillars %}
  <a href="{{ pillar.href }}" class="pillar-card">
    {% if pillar.get('image') %}<div class="pillar-media"><img src="{{ pillar.image }}" alt="" class="pillar-banner-img" width="800" height="600"></div>{% else %}<div class="pillar-icon">{{ pillar.icon }}</div>{% endif %}
    <h2 class="pillar-title">{{ pillar.title }}</h2>
    <p class="pillar-desc">{{ pillar.description }}</p>
    <div class="pillar-action">{{ pillar.action }}</div>
  </a>
  {% endfor %}
</div>
{% endblock %}
