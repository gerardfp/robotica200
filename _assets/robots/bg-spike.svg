<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Filtre ombra de profunditat suau -->
    <filter id="depth-shadow-sp" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-3" dy="7" stdDeviation="9" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="platform-shadow-sp" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.22"/>
    </filter>

    <!-- Gradients Color 1 (Fons dominant i facetes isomètriques) -->
    <linearGradient id="bg-base-sp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="45%" stop-color="#d82098"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="iso-top-sp" x1="15%" y1="100%" x2="85%" y2="0%">
      <stop offset="0%" stop-color="#d82098"/>
      <stop offset="60%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>

    <linearGradient id="iso-left-sp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#500724"/>
    </linearGradient>

    <linearGradient id="iso-right-sp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d82098"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>

    <!-- Gradients Color 2 (Ona corbada, accents i dinamisme) -->
    <linearGradient id="wave-main-sp" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fddc3e"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <linearGradient id="wave-sub-sp" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#fefce8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fddc3e" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="curved-track-sp" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- 1. Fons base degradat Color 1 -->
  <rect width="480" height="330" fill="url(#bg-base-sp)"/>

  <!-- 2. Línies de guia isomètriques subtils a 30° (toc STEAM/CAD discret) -->
  <g stroke="#fbcfe8" stroke-width="1" opacity="0.14" stroke-dasharray="2,5">
    <line x1="-60" y1="90" x2="260" y2="275"/>
    <line x1="-10" y1="30" x2="320" y2="220"/>
    <line x1="60" y1="-20" x2="400" y2="176"/>
    <line x1="140" y1="-60" x2="480" y2="136"/>
    <line x1="500" y1="30" x2="180" y2="215"/>
    <line x1="560" y1="90" x2="240" y2="275"/>
  </g>

  <!-- 3. Gran ona corbada orgànica superposada (Color 2 vibrant) -->
  <path d="M 230,-20 C 310,-15 410,25 440,95 C 475,170 455,245 385,290 C 320,330 230,325 170,295 C 245,260 320,225 340,155 C 360,80 290,30 230,-20 Z" 
        fill="url(#wave-main-sp)" 
        filter="url(#depth-shadow-sp)"/>

  <!-- 4. Segona capa corbada suau superposada (To lluminós Color 2) -->
  <path d="M 290,-10 C 365,30 425,85 415,155 C 400,220 345,270 280,295 C 340,260 380,215 385,155 C 390,95 345,45 290,-10 Z" 
        fill="url(#wave-sub-sp)"/>

  <!-- 5. Plataforma Isomètrica 3D en perspectiva axonomètrica (30 graus) -->
  <g filter="url(#platform-shadow-sp)">
    <!-- Ombra projectada sota la plataforma -->
    <ellipse cx="325" cy="275" rx="115" ry="38" fill="#000000" opacity="0.22"/>

    <!-- Faceta frontal esquerra (ombra pròpia) -->
    <polygon points="190,195 315,267 315,295 190,223" fill="url(#iso-left-sp)"/>

    <!-- Faceta frontal dreta (reflex suau) -->
    <polygon points="315,267 445,192 445,220 315,295" fill="url(#iso-right-sp)"/>

    <!-- Cara superior isomètrica -->
    <polygon points="315,123 445,192 315,267 190,195" fill="url(#iso-top-sp)"/>

    <!-- Vores i línies estructurals bisellades de la plataforma -->
    <polyline points="190,195 315,123 445,192" fill="none" stroke="#fbcfe8" stroke-width="1.8" opacity="0.5"/>
    <line x1="315" y1="267" x2="315" y2="295" stroke="#fbcfe8" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- 6. Línies corbades dinàmiques que creuen l'espai isomètric -->
  <path d="M 70,295 C 160,285 220,235 275,170 C 325,110 380,60 465,35" 
        fill="none" 
        stroke="url(#curved-track-sp)" 
        stroke-width="3.2" 
        stroke-linecap="round"/>

  <path d="M 105,312 C 185,300 245,255 295,195 C 340,140 395,90 475,65" 
        fill="none" 
        stroke="#fef08a" 
        stroke-width="1.4" 
        stroke-dasharray="5,7" 
        opacity="0.7"/>

  <!-- 7. Nodes STEAM connectors circulars en perspectiva -->
  <circle cx="420" cy="52" r="7" fill="#fef08a" opacity="0.8" filter="url(#depth-shadow-sp)"/>
  <circle cx="420" cy="52" r="3" fill="#ffffff" opacity="0.95"/>

  <circle cx="275" cy="170" r="5.5" fill="#fefce8" opacity="0.75"/>
  <circle cx="275" cy="170" r="2.2" fill="#ffffff" opacity="0.9"/>

  <circle cx="355" cy="240" r="4" fill="#fbcfe8" opacity="0.6"/>
</svg>