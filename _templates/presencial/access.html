<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="same-origin">
<title>Formació presencial · Accés</title>
<link rel="icon" type="image/svg+xml" href="../_assets/icons/logo.svg">
<link rel="stylesheet" href="access.css"><script src="access.js" defer></script>
</head>
<body data-payload="{{PAYLOAD}}">
<main class="access-card">
<img class="brand" src="../_assets/icons/logo.svg" alt="Robòtica per a docents" width="52" height="52">
<p class="eyebrow">Robòtica per a docents</p><h1>Formació presencial</h1>
<p>Materials per a les sessions de formació. Introduïu la contrasenya que us ha facilitat la persona formadora.</p>
<form id="access-form">
<label for="password">Contrasenya</label>
<input id="password" name="password" type="password" autocomplete="current-password" required autofocus disabled>
<button type="submit" disabled>Accedir als materials</button>
</form>
<p id="access-status" role="status" aria-live="polite"></p>
<p class="hint">L’accés es manté durant aquesta pestanya. Podeu tancar la sessió des dels materials.</p>
<noscript>Cal activar JavaScript per desxifrar els materials.</noscript>
</main>
</body></html>
