<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title" x-sync>Pensament Computacional Desendollat | Robòtica200</title>
  <meta name="description" content="Activitats desendollades de pensament computacional per a l'aula.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../_css/styles.css?v=2">
  <link rel="icon" type="image/svg+xml" href="../_assets/icons/logo.svg">
  <script src="../_js/cataleg.js?v=10a126d"></script>
  <script src="../_js/components.js?v=10a126d"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@imacrayon/alpine-ajax@0.12.7/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body>
  <site-header id="site-header" x-sync active="pensament" root="../"></site-header>
  <main id="page-content" class="container page-content">
  <div class="robots-hero">
    <div class="container robots-hero-inner">
      <nav-back href="../index.html" label="inici"></nav-back>
      <div class="robots-hero-content">
        <h1 class="robots-hero-title">Pensament Computacional</h1>
        <p class="robots-hero-desc">Activitats desendollades per treballar instruccions, patrons, decisions i dades amb el cos i materials d'aula.</p>
        <div class="accent-dashes" aria-hidden="true"><span class="dash dash-red"></span><span class="dash dash-yellow"></span><span class="dash dash-blue"></span></div>
      </div>
      <div class="robots-hero-media">
        <img src="../_assets/banners/pensament-computacional.png" alt="Pensament Computacional" class="robots-hero-img" width="800" height="600">
      </div>
    </div>
  </div>
    <div class="clean-grid" x-data="{ items: window.CATALEG.activitats }">
      <template x-for="item in items" :key="item.id">
        <a :id="item.id" :href="'../' + item.url" x-target.push="page-content" class="item-card">
          <div class="card-top">
            <span class="tag-badge primary" x-text="item.tag"></span>
            <span class="tag-badge" x-show="item.cicle" x-text="item.cicle"></span>
          </div>
          <h3 class="item-title" x-text="item.titol"></h3>
          <p class="item-desc" x-text="item.descripcio"></p>
          <div class="item-footer"><span x-text="'⏱️ ' + item.durada"></span><span>Veure activitat →</span></div>
        </a>
      </template>
    </div>

  </main>
  <site-footer></site-footer>
</body>
</html>
